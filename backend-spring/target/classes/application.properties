# SFit Virtual Try-On Spring Boot Configuration

server.port=5000

spring.application.name=sfit-backend

# Multipart Configuration (supports large posture photo uploads up to 20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Data Source (Default: Embedded H2 in MySQL mode for instant out-of-the-box run, easily overridable for MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sfit_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (optional, for debugging at http://localhost:5000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Replicate AI API Configuration (cuuupid/idm-vton)
replicate.api.token=${REPLICATE_API_TOKEN:r8_KDJRpmDDFpUe9zO9qnJo7MnVFhfXvQM1k9Wsx}
replicate.api.model-endpoint=https://api.replicate.com/v1/models/cuuupid/idm-vton/predictions
replicate.api.poll-base-url=https://api.replicate.com/v1/predictions/

# Uploads directory path
app.upload.dir=uploads

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Twilio SMS Credentials
twilio.account.sid=${TWILIO_ACCOUNT_SID:your_twilio_account_sid_here}
twilio.auth.token=${TWILIO_AUTH_TOKEN:your_twilio_auth_token_here}
twilio.phone.number=${TWILIO_PHONE_NUMBER:your_twilio_phone_number_here}
